[project]
name = "or-audit"
version = "0.1.0a0"
description = "Eval harness for procedural medical AI (Harbor analog): vector verifier, tasks, datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "SeldingerMed" }]
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
]

[project.scripts]
or-audit = "or_audit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
lumen = [
    "gymnasium>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/or_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/or_audit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "RUF",               # ruff-specific
    "ANN",               # annotations
    "PT",                # pytest style
    "RET",               # returns
    "TID",               # tidy imports
]
ignore = [
    "ANN401",  # allow Any in narrow, documented places
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]

[tool.mypy]
# 3.12 rather than 3.11: numpy ships stubs using PEP 695 `type` statements,
# which mypy only parses at 3.12+. Runtime support remains 3.11 and the test
# matrix covers it; this setting affects stub parsing, not emitted code.
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["lumen.*", "gymnasium.*"]
ignore_missing_imports = true
