format_version = "1"
id = "endoscope-nav-safe"
task_version = "0"

[metadata]
title = "Wall-safe flexible endoscope navigation"
family = "endoscopy"
modality = "endoscopic-sim"
tags = ["lumen", "endoscopy", "airway", "gi", "navigation"]
safety_critical = true

[subject]
kind = "policy"

[phi]
class = "procedural"

[environment]
# Same Layer 0 as endovascular: a continuum instrument in a deformable lumen.
# A Lumen endoscopy profile (airway / GI) is a world pin, not a new harness.
kind = "lumen-gym"
gym_id = "Lumen/EndoscopeNav-v0"
world_pin = ""
n_eval_episodes = 30
seed_policy = "deterministic-eval-30"

[agent]
kinds = ["policy", "random"]
action_space = "insertion_twist"
timeout_sec = 120.0

[oracle]
kind = "physics"

[verifier]
abstain_ok = false
headline = "safe_success"

[[verifier.gates]]
id = "wall_penetration"

[[verifier.metrics]]
id = "raw_success"

[[verifier.metrics]]
id = "safe_success"

[[verifier.metrics]]
id = "diverged"

[attestation]
level = "none"

[decision]
emit_human_determination = false
