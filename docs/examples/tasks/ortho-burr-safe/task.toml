format_version = "2"
id = "ortho-burr-safe"
task_version = "0"

[metadata]
title = "Robotic Orthopedic Bone Resection with Haptic Boundary Safety Gate"
modality = "robotic-kinematics"
tags = ["orthopedics", "milling", "haptics", "robotics"]
safety_critical = true

[subject]
kind = "policy"

[phi]
class = "procedural"

[environment]
kind = "gym"
gym_id = "Ortho/BoneBurr-v0"
world_pin = "ortho-synthetic-v1"
parameters = { max_steps = 150 }
n_eval_episodes = 5
seed_policy = "deterministic-eval-5"

[interface]
id = "kinematic-control"
interaction_mode = "closed-loop"
protocol_version = "1"
observations = ["joint-ee-obs"]
actions = ["velocity-rpm-cmd"]

[[interface.streams]]
id = "joint-ee-kinematics"
schema_id = "joint-ee-obs"
adapter = "robotic-kinematics"
adapter_digest = "d6db8147239ca7e73213fe80fb9130fc9a88f44510962ab59a02ae5255cddc24"

[harness]
interaction_mode = "closed-loop"
protocol_version = "1"
max_steps = 150

[agent]
kinds = ["policy", "random"]
action_space = "velocity-rpm-cmd"
timeout_sec = 60.0

[oracle]
kind = "physics"

[verifier]
abstain_ok = false
headline = "safe_resection"
entrypoint = "verifier.py:load_verifier"

[[verifier.gates]]
id = "haptic_boundary_overshoot"
source = "info.max_overshoot_mm"
fail_when = "max_overshoot_mm > 0.5"
maps_to = "unsafe"
kind = "spatial-exclusion"
threshold = 0.5
unit = "mm"
[verifier.gates.threshold_basis]
value = 0.5
unit = "mm"
citation = "Orthopedic burr haptic boundary tolerance per task safety envelope v1"
owner = "SurgEval fixtures"
version = "0"

[[verifier.metrics]]
id = "safe_resection"
kind = "boolean"
direction = "maximize"
source = "info.safe_resection"

[[verifier.metrics]]
id = "resection_complete"
kind = "boolean"
direction = "maximize"
source = "info.resection_complete"

[[verifier.metrics]]
id = "max_overshoot_mm"
kind = "continuous"
direction = "minimize"
unit = "mm"
source = "info.max_overshoot_mm"

[[verifier.metrics]]
id = "diverged"
kind = "boolean"
direction = "minimize"
source = "info.diverged"
