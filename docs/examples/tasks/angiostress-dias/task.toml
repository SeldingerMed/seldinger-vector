format_version = "2"
id = "angiostress-dias"
task_version = "1"

[metadata]
title = "AngioStress v0.1 full release audit"
modality = "dsa-video"
tags = ["angiostress", "dias", "video-predict"]
safety_critical = true

[subject]
kind = "model"

[phi]
class = "public"

[environment]
kind = "angiostress-contract"
n_eval_episodes = 1
seed_policy = "single-release-audit"
inputs_path = "inputs.json"
labels_path = "labels.json"
contract_path = "contract.json"

[interface]
id = "video-predict"
interaction_mode = "single-turn"
protocol_version = "1"
observations = ["dsa-sequence"]
outputs = ["release-audit"]

[harness]
interaction_mode = "single-turn"
protocol_version = "1"
max_steps = 1

[agent]
kinds = ["frozen-model"]
timeout_sec = 600.0

[oracle]
kind = "contract"

[verifier]
abstain_ok = false
headline = "release_audit_passed"
entrypoint = "verifier.py:load_verifier"

[[verifier.gates]]
id = "finite_metric_check"
realization = "release-audit"
provenance = "release-audit verifier derives finiteness from the five kernel-hashed predicted release metrics (all finite, no NaN/Inf) in the pinned AngioStress audit"

[verifier.gates.inputs]
dias_prediction_count = "prediction.dias_prediction_count"
cathaction_prediction_count = "prediction.cathaction_prediction_count"
sam_vit_b_mean_dice = "prediction.sam_vit_b_mean_dice"
sam_vit_l_mean_dice = "prediction.sam_vit_l_mean_dice"
medsam_vit_b_mean_dice = "prediction.medsam_vit_b_mean_dice"

[[verifier.metrics]]
id = "release_audit_passed"
kind = "boolean"
direction = "maximize"

[[verifier.metrics]]
id = "dias_prediction_count"
kind = "continuous"
unit = "count"
direction = "neutral"

[[verifier.metrics]]
id = "cathaction_prediction_count"
kind = "continuous"
unit = "count"
direction = "neutral"

[[verifier.metrics]]
id = "sam_vit_b_mean_dice"
kind = "continuous"
unit = "fraction"
direction = "maximize"

[[verifier.metrics]]
id = "sam_vit_l_mean_dice"
kind = "continuous"
unit = "fraction"
direction = "maximize"

[[verifier.metrics]]
id = "medsam_vit_b_mean_dice"
kind = "continuous"
unit = "fraction"
direction = "maximize"

[attestation]
level = "none"

[decision]
emit_human_determination = false
