name: container

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - README.md
      - src/**
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/seldingermed/seldinger-vector-cloud:${{ github.sha }}
            ghcr.io/seldingermed/seldinger-vector-cloud:main

      - name: Make the linked package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api --method PATCH
          /orgs/SeldingerMed/packages/container/seldinger-vector-cloud
          -f visibility=public

      - name: Report immutable image
        run: echo "ghcr.io/seldingermed/seldinger-vector-cloud@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
